<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FalconBroom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; flex-direction: column;
           font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    .spinner { width: 36px; height: 36px; border: 4px solid #334155; border-top-color: #14b8a6;
               border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 18px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #msg { opacity: 0.85; text-align: center; max-width: 420px; line-height: 1.5; }
    .error .spinner { display: none; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div id="msg">Starting FalconBroom&hellip;</div>
  <script>
    (function () {
      var base = (window.__FALCONBROOM_CONTROL_URL || window.__FALCONBROOM_BACKEND_URL || 'http://127.0.0.1:3009').replace(/\/$/, '');
      var deadline = Date.now() + 120000;
      function tick() {
        fetch(base + '/health').then(function (r) {
          if (r.ok) { location.replace('index.html'); } else { retry(); }
        }).catch(retry);
      }
      function retry() {
        if (Date.now() > deadline) {
          document.body.className = 'error';
          document.getElementById('msg').textContent =
            'FalconBroom could not start its local engine. Please close the app and try again. If this continues, do not delete your data: the Windows profile key or a data migration may need attention.';
          return;
        }
        setTimeout(tick, 500);
      }
      tick();
    })();
  </script>
</body>
</html>
